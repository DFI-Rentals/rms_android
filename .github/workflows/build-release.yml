name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'adopt'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > keystore/release.jks

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleProdRelease

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          name: DFI Rentals RMS ${{ github.ref_name }}
          body: |
            ## DFI Rentals RMS Android App

            ### Installation
            1. Download the APK file below
            2. Install on your Android device
            3. Existing installations will be updated automatically

            ### What's New
            - Push alerts: call-style pages from User Management, delivered through Firebase
            - Device registry: the app reports which staff member is signed in on it
            - Build tools updated (Android 14 target)
          files: |
            ./app/build/outputs/apk/prod/release/app-prod-release.apk
          draft: false
          prerelease: false
