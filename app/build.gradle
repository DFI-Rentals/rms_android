plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    compileSdk 34
    namespace 'com.dfirentals.rms'

    defaultConfig {
        applicationId "com.dfirentals.rms"
        minSdk 21
        targetSdk 34
        versionCode 12
        versionName "2.1"
    }

    // prod = the real app. preview = same code under a second applicationId so
    // it installs NEXT TO the real app on a device for previews (never released).
    flavorDimensions "channel"
    productFlavors {
        prod {
            dimension "channel"
            resValue "string", "app_name", "DFI Rentals RMS"
        }
        preview {
            dimension "channel"
            applicationIdSuffix ".preview"
            versionNameSuffix "-preview"
            resValue "string", "app_name", "DFI RMS Preview"
        }
    }

    signingConfigs {
        release {
            storeFile file('../keystore/release.jks')
            storePassword 'dfirentals123'
            keyAlias 'dfirentals'
            keyPassword 'dfirentals123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Firebase Cloud Messaging: the push transport (SNS -> FCM -> RmsMessagingService)
    implementation platform('com.google.firebase:firebase-bom:33.4.0')
    implementation 'com.google.firebase:firebase-messaging'
}
