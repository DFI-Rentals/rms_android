plugins {
    id 'com.android.application'
}

android {
    compileSdk 30

    defaultConfig {
        applicationId "com.dfirentals.rms"
        minSdk 21
        targetSdk 30
        versionCode 11
        versionName "2.0"
    }

    // prod = the real app. preview = same code under a second applicationId so
    // it installs NEXT TO the real app on a device for previews (never released).
    flavorDimensions "channel"
    productFlavors {
        prod {
            dimension "channel"
            resValue "string", "app_name", "DFI Rentals RMS"
        }
        preview {
            dimension "channel"
            applicationIdSuffix ".preview"
            versionNameSuffix "-preview"
            resValue "string", "app_name", "DFI RMS Preview"
        }
    }

    signingConfigs {
        release {
            storeFile file('../keystore/release.jks')
            storePassword 'dfirentals123'
            keyAlias 'dfirentals'
            keyPassword 'dfirentals123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
}
